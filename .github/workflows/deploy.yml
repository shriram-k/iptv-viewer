name: Deploy app

# Manual trigger only — deploy the v2 app (app/) to Cloudflare Workers on demand.
# Runs the test suite first so a red build never ships. The build inlines the public
# VITE_GA4_MEASUREMENT_ID via the `deploy` npm script; wrangler authenticates with the
# CLOUDFLARE_* secrets below.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22.15+ required: the Vite build loads @cloudflare/vite-plugin, which uses
          # module.registerHooks() (added in Node 22.15 / 23.5). Node 20 fails the build.
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build & deploy to Cloudflare
        env:
          # wrangler reads CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID from the env.
          # Reuse the existing pipeline secrets (CF_API_TOKEN / CF_ACCOUNT_ID) so no new
          # secret is needed — but CF_API_TOKEN must carry the "Edit Cloudflare Workers"
          # permissions (Workers Scripts:Edit + Workers KV Storage:Edit + Account:Read),
          # which is broader than the KV-only scope the daily pipeline needs.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npm run deploy
